<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register</title>
  </head>
  <body>
    <header id="header">
      <nav>
        <a href="index.html">
          <button>Home</button>
        </a>
        <a href="login.html">
          <button>Login</button>
        </a>
      </nav>
      <form id="loginForm">
        <div class="inputContainer">
          <div class="credentialContainer">
            <label for="registerName">Username:</label>
            <input
              type="text"
              id="registerName"
              placeholder="Example"
            />
          </div>
          <div class="credentialContainer">
            <label for="registerEmail">Email:</label>
            <input
              type="email"
              id="registerEmail"
              placeholder="example@mail.com"
            />
          </div>
          <div class="credentialContainer">
            <label for="registerPassword">Password:</label>
            <input type="password" id="registerPassword" placeholder="3x4mpl3" />
          </div>
        </div>
        <button>Register</button>
      </form>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/register.ts"></script>
  </body>
</html>
